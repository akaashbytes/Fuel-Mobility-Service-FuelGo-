server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: customer-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/customers/**
        - id: provider-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/providers/**
        - id: order-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/orders/**
        - id: payment-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/payments/**
        - id: feedback-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/feedback/**
        - id: tracking-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/tracking/**
        - id: analytics-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/analytics/**
        - id: admin-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/admin/**

jwt:
  secret: "9a76a5b432e1f0987654321fedcba0987654321fedcba0987654321fedcba0987654321fedcba09"
