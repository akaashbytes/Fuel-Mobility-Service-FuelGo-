server:
  port: 8083

spring:
  application:
    name: provider-service
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: nexfuel
    password: password
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
